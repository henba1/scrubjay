# Codecov config. The report is produced by the coverage job in .github/workflows/test.yml
# (kcov → cobertura); CONTRIBUTING.md covers reproducing it locally.

codecov:
  require_ci_to_pass: true      # a red suite's coverage number is meaningless

coverage:
  precision: 1
  round: down
  # Colour gradient only — changes no pass/fail behaviour. Target is ~100%; the low anchor is
  # where the badge reads fully red.
  range: "50...100"
  status:
    project:
      default:
        informational: true     # measured, never a merge gate
    patch:
      default:
        informational: true

comment:
  layout: "condensed_header, diff, files"
  require_changes: true         # stay quiet on PRs that don't move coverage
  behavior: default

flags:
  shell:
    paths:
      - bin/
      - hooks/
    carryforward: false

# kcov already restricts itself to bin/ and hooks/ via --include-path. mcp/ is the deliberate
# exclusion: sjmcp_server.py has no tests, and folding 800 untested Python lines into a shell
# coverage number would produce a wrong headline.
ignore:
  - "tests/**"
  - "skeleton/**"
  - "docs/**"
  - "site/**"
  - "commands/**"
  - "mcp/**"
