# scrubjay's tmux status bar - for the sessions bin/sj-keep.sh keeps, and any other. Source it from
# ~/.tmux.conf (bin/onboard.sh offers to add the line):
#
#   source-file "$HOME/.claude/hooks/../tmux/scrubjay.conf"
#
# Left: this pane's agent - its project (the git repository) ⎇ branch · session id · working / waiting
# / idle and since when - then the project's other sessions here. Right: the session's title · time ·
# date · host. A click on the left (or prefix S) opens the session picker in a popup.
# Black and dim, and nothing stays put on the screen (bin/sj-status.sh): made for OLED screens.

set -g status-style "bg=#000000,fg=#4e5258"
set -g status-interval 10
set -g status-justify centre
set -g status-left-length 160
set -g status-right-length 90
# single quotes: tmux would expand ${...} itself, and knows no ${X:-default} - the shell of #() does
set -g status-left  '#(bash "${CLAUDE_CONFIG_DIR:-$HOME/.claude}/hooks/../bin/sj-status.sh" left #{q:session_name} #{q:pane_id} #{client_width} #{q:pane_title})'
set -g status-right '#(bash "${CLAUDE_CONFIG_DIR:-$HOME/.claude}/hooks/../bin/sj-status.sh" right #{q:pane_title} #{client_width})'
# the window list only when there is more than one window
set -g window-status-format         "#{?#{==:#{session_windows},1},,#[fg=#3a3d42]#I:#W}"
set -g window-status-current-format "#{?#{==:#{session_windows},1},,#[fg=#7b8496]#I:#W}"
set -g window-status-separator "  "
set -g message-style "bg=#000000,fg=#7b8496"
set -g mode-style "bg=#2b63b8,fg=#ffffff"
# the menu in the same colours (tmux 3.4 and later; -q: older ones skip it)
set -gq menu-style "bg=#000000,fg=#7b8496"
set -gq menu-selected-style "bg=#2b63b8,fg=#ffffff"
set -gq menu-border-style "fg=#2e333a"

# a click on the left part (needs `set -g mouse on`), and prefix S: the session picker (bin/sj-pick.py)
# in a popup, on this pane's project - every session of it, live and past, on every machine. Enter
# switches to the chosen one, or resumes it in a new sj-* session and switches there. tmux before
# 3.2 has no popups: the click opens a menu of the project's live sessions instead.
%if "#{>=:#{version},3.2}"
bind -n MouseDown1StatusLeft display-popup -E -w 90% -h 85% -d '#{pane_current_path}' 'bash "${CLAUDE_CONFIG_DIR:-$HOME/.claude}/hooks/../bin/sj.sh" pick --popup'
bind S display-popup -E -w 90% -h 85% -d '#{pane_current_path}' 'bash "${CLAUDE_CONFIG_DIR:-$HOME/.claude}/hooks/../bin/sj.sh" pick --popup'
%else
bind -n MouseDown1StatusLeft run-shell -b 'bash "${CLAUDE_CONFIG_DIR:-$HOME/.claude}/hooks/../bin/sj-status.sh" menu #{q:client_name} #{q:session_name} #{q:pane_id} #{mouse_x}'
%endif

# tmux 3.4 and later: a click on a related session goes straight to its pane (the bar marks each one
# as a range named by its pane id); elsewhere on the left, the menu above. Window ranges keep tmux's own.
# (run-shell: it expands the range into the target, which switch-client itself would not)
%if "#{>=:#{version},3.4}"
bind -n MouseDown1Status if -F "#{m:%*,#{mouse_status_range}}" "run-shell -b \"tmux switch-client -c '#{client_name}' -t '#{mouse_status_range}'\"" "select-window -t ="
%endif
