# scrubjay's tmux status bar - for the sessions bin/sj-keep.sh keeps, and any other. Source it from
# ~/.tmux.conf (bin/onboard.sh offers to add the line):
#
#   source-file ~/.claude/hooks/../tmux/scrubjay.conf
#
# Left: this pane's agent - its project (the git repository) ⎇ branch · session id · working / waiting
# / idle and since when - then the project's other sessions here. Right: the session's title · time ·
# date · host. A click on the left opens a menu of those sessions; choosing one switches to its pane.
# Black and dim, and nothing stays put on the screen (bin/sj-status.sh): made for OLED screens.

set -g status-style "bg=#000000,fg=#4e5258"
set -g status-interval 10
set -g status-justify centre
set -g status-left-length 160
set -g status-right-length 90
set -g status-left  "#(bash \"${CLAUDE_CONFIG_DIR:-$HOME/.claude}/hooks/../bin/sj-status.sh\" left #{q:session_name} #{q:pane_id} #{client_width} #{q:pane_title})"
set -g status-right "#(bash \"${CLAUDE_CONFIG_DIR:-$HOME/.claude}/hooks/../bin/sj-status.sh\" right #{q:pane_title} #{client_width})"
# the window list only when there is more than one window
set -g window-status-format         "#{?#{==:#{session_windows},1},,#[fg=#3a3d42]#I:#W}"
set -g window-status-current-format "#{?#{==:#{session_windows},1},,#[fg=#7b8496]#I:#W}"
set -g window-status-separator "  "
set -g message-style "bg=#000000,fg=#7b8496"
set -g mode-style "bg=#2b63b8,fg=#ffffff"
# the menu in the same colours (tmux 3.4 and later; -q: older ones skip it)
set -gq menu-style "bg=#000000,fg=#7b8496"
set -gq menu-selected-style "bg=#2b63b8,fg=#ffffff"
set -gq menu-border-style "fg=#2e333a"

# a click on the left part: the project's sessions (needs `set -g mouse on`)
bind -n MouseDown1StatusLeft run-shell -b "bash \"${CLAUDE_CONFIG_DIR:-$HOME/.claude}/hooks/../bin/sj-status.sh\" menu #{q:client_name} #{q:session_name} #{q:pane_id} #{mouse_x}"
